[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comicdesk"
version = "0.1.0"
description = "Ein Dateimanager nur fuer Comics: browsen, lesen, taggen, ordnen"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Gemeinsames Grundgeruest mit den anderen *desk-Apps (siehe
    # ../deskkit) - noch kein eigenes Repo/PyPI-Paket, deshalb per
    # `pip install -r requirements.txt` (editable) statt hier direkt
    # aufloesbar.
    "deskkit",
    "PySide6>=6.6",
    "pymupdf>=1.23",
    "comictagger>=1.5.5",
    "send2trash>=1.8",
    "requests>=2.31",
    # 11.3 bringt AVIF ohne Zusatzpaket mit.
    "pillow>=11.3",
    # API-Schluessel im System-Schluesselbund statt im Klartext in
    # QSettings - siehe deskkit.secrets.
    "keyring>=24",
]

[project.optional-dependencies]
# JPEG XL braucht ein Zusatzpaket; ohne das fehlt nur dieses eine Zielformat
# im Bildkonverter, alles andere laeuft unveraendert.
jxl = ["pillow-jxl-plugin>=1.3"]

[project.urls]
Homepage = "https://github.com/aaaaaprvdgrwwelt/comicdesk"

[project.scripts]
comicdesk = "comicdesk.__main__:main"

[tool.setuptools.packages.find]
include = ["comicdesk*"]

[tool.ruff]
target-version = "py310"
line-length = 92

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = [
    "E501",  # Zeilenlaenge wird von Hand umgebrochen, nicht erzwungen
    "B008",  # QModelIndex() als Vorgabewert ist die uebliche Qt-Modell-Signatur
]
